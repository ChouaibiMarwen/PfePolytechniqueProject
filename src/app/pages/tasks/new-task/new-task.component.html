<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8"></div>
<!-- Page content -->
<div class="container-fluid mt--7">
  <!-- Form -->
  <div class="row">
    <div class="col">
      <div class="card shadow">
        <div class="card-header border-0" style="display: flex;justify-content: space-between;align-items: center">
          <h3 class="mb-0">New Task</h3>
        </div>
        <div class="card-body">
          <div class="alert alert-danger" role="alert" *ngIf="Error">
            {{Error}}
          </div>
          <div class="alert alert-success" role="alert" *ngIf="Success">
            {{Success}}
          </div>
          <div class="alert alert-warning" role="alert" *ngIf="Warning">
            {{Warning}}
          </div>
          <form [formGroup]="missionForm" >
            <div class="form-group">
              <label for="title">Title</label>
              <input id="title" type="text" class="form-control" formControlName="title" placeholder="Enter mission title" required>
            </div>
            <div class="form-group">
              <label for="address">description</label>
              <textarea id="address" class="form-control" formControlName="address" placeholder="Enter address" required></textarea>
            </div>
            <div class="form-group">
              <label for="budget">fileurl</label>
              <input id="budget" type="text" class="form-control" formControlName="budget" placeholder="Enter budget" required>
            </div>
            <div class="form-group">
              <label for="startdate">Start Date</label>
              <input id="startdate" type="date" class="form-control" formControlName="startdate" required>
            </div>
            <div class="form-group">
              <label for="enddate">End Date</label>
              <input id="enddate" type="date" class="form-control" formControlName="enddate" required>
            </div>
            <div class="form-group">
              <label for="idTechniciens">Participants</label>
              <select id="idTechniciens" class="form-control" formControlName="idTechniciens" multiple (change)="onTechniciansChange()">
                <option *ngFor="let technician of CurrentMission.participants" [value]="technician.id">{{ technician.name }}</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" (click)="onSubmit()">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
